<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttendEase</title>
    <meta name="description" content="Student attendance management dashboard with class and subject scheduling, date-wise and monthly reporting, low-attendance alerts, CSV export, and localStorage persistence." />
    <meta property="og:title" content="AttendEase" />
    <meta property="og:description" content="Student attendance management dashboard with class and subject scheduling, date-wise and monthly reporting, low-attendance alerts, CSV export, and localStorage persistence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-muted: #f1f5f9;
        --surface-hover: #f8fafc;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --text: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent: #1d4ed8;
        --accent-hover: #1e40af;
        --accent-soft: #eff6ff;
        --accent-text: #1d4ed8;
        --success: #15803d;
        --success-bg: #f0fdf4;
        --success-border: #bbf7d0;
        --warning: #b45309;
        --warning-bg: #fffbeb;
        --warning-border: #fde68a;
        --danger: #b91c1c;
        --danger-bg: #fef2f2;
        --danger-border: #fecaca;
        --chart-grid: #e2e8f0;
        --chart-present: #16a34a;
        --chart-late: #d97706;
        --chart-absent: #dc2626;
        --chart-line: #1d4ed8;
        --chart-area: rgba(29, 78, 216, 0.10);
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-lg: 0 16px 40px -12px rgba(15, 23, 42, 0.16);
        --radius: 10px;
        --radius-sm: 7px;
        --sidebar-w: 256px;
        --topbar-h: 64px;
        --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      [data-theme="dark"] {
        --bg: #0b1120;
        --surface: #111827;
        --surface-muted: #1e293b;
        --surface-hover: #172033;
        --border: #1e293b;
        --border-strong: #334155;
        --text: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-soft: rgba(59, 130, 246, 0.14);
        --accent-text: #93c5fd;
        --success: #4ade80;
        --success-bg: rgba(22, 163, 74, 0.14);
        --success-border: rgba(74, 222, 128, 0.25);
        --warning: #fbbf24;
        --warning-bg: rgba(217, 119, 6, 0.14);
        --warning-border: rgba(251, 191, 36, 0.25);
        --danger: #f87171;
        --danger-bg: rgba(220, 38, 38, 0.14);
        --danger-border: rgba(248, 113, 113, 0.25);
        --chart-grid: #1e293b;
        --chart-present: #22c55e;
        --chart-late: #f59e0b;
        --chart-absent: #ef4444;
        --chart-line: #60a5fa;
        --chart-area: rgba(96, 165, 250, 0.14);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
        --shadow-lg: 0 20px 44px -12px rgba(0, 0, 0, 0.55);
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4 {
        font-family: var(--font-display);
        margin: 0;
        letter-spacing: -0.015em;
        color: var(--text);
      }

      button, input, select, textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .tabular {
        font-variant-numeric: tabular-nums;
      }

      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      /* App Shell */
      .app-shell {
        display: flex;
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        z-index: 40;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .sidebar-header {
        height: var(--topbar-h);
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text);
        cursor: pointer;
        border: none;
        background: transparent;
        padding: 0;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .brand-name {
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }

      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .nav-section-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        padding: 10px 12px 4px;
      }

      .nav-item {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        min-height: 40px;
        border: none;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        text-align: left;
        white-space: nowrap;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .nav-item:hover {
        background: var(--surface-muted);
        color: var(--text);
      }

      .nav-item.active {
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
      }

      .nav-item-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .nav-item-left span {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .nav-count {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--danger);
        font-variant-numeric: tabular-nums;
      }

      .sidebar-footer {
        padding: 14px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .institution-meta {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .theme-toggle-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        min-height: 38px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease;
        }

      .theme-toggle-btn:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }

      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        z-index: 35;
      }

      .sidebar-close-btn {
        display: none;
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 6px;
      }

      /* Main Container */
      .main-wrapper {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        height: var(--topbar-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        position: sticky;
        top: 0;
        z-index: 25;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mobile-menu-btn {
        display: none;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        flex-shrink: 0;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .breadcrumb strong {
        color: var(--text);
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 600;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .global-search-wrap {
        position: relative;
        width: 240px;
      }

      .global-search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      .global-search-input {
        width: 100%;
        height: 38px;
        padding: 0 12px 0 34px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
        font-size: 13px;
        transition: border-color 0.15s ease, background-color 0.15s ease;
      }

      .global-search-input:focus {
        background: var(--surface);
        border-color: var(--accent);
        outline: none;
      }

      .global-search-dropdown {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        min-width: 300px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        z-index: 50;
        max-height: 320px;
        overflow-y: auto;
        display: none;
      }

      .global-search-dropdown.open {
        display: block;
      }

      .search-result-item {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-bottom: 1px solid var(--border);
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        text-align: left;
        cursor: pointer;
      }

      .search-result-item:last-child {
        border-bottom: none;
      }

      .search-result-item:hover {
        background: var(--surface-muted);
      }

      .main-content {
        flex: 1;
        padding: 24px;
        max-width: 1360px;
        width: 100%;
        margin: 0 auto;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 38px;
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .btn-primary {
        background: var(--accent);
        color: #ffffff;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-secondary {
        background: var(--surface);
        border-color: var(--border);
        color: var(--text);
      }

      .btn-secondary:hover {
        background: var(--surface-muted);
        border-color: var(--border-strong);
      }

      .btn-danger {
        background: var(--danger-bg);
        border-color: var(--danger-border);
        color: var(--danger);
      }

      .btn-danger:hover {
        background: var(--danger);
        color: #ffffff;
      }

      .btn-ghost {
        background: transparent;
        color: var(--text-secondary);
        padding: 6px 10px;
        min-height: 34px;
      }

      .btn-ghost:hover {
        background: var(--surface-muted);
        color: var(--text);
      }

      .btn-sm {
        min-height: 32px;
        padding: 5px 11px;
        font-size: 12px;
      }

      /* Page Header */
      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      .page-title {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.25;
        text-wrap: balance;
      }

      .page-subtitle {
        margin: 4px 0 0;
        color: var(--text-muted);
        font-size: 13px;
      }

      .page-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      /* Cards & Grids */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
      }

      .kpi-card {
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .kpi-card.clickable {
        cursor: pointer;
        transition: border-color 0.15s ease;
      }

      .kpi-card.clickable:hover {
        border-color: var(--border-strong);
      }

      .kpi-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .kpi-value {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 700;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }

      .kpi-meta {
        font-size: 12px;
        color: var(--text-muted);
      }

      .charts-grid {
        display: grid;
        grid-template-columns: 1.45fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }

      .card-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .card-title {
        font-size: 15px;
        font-weight: 600;
      }

      .card-subtitle {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .card-body {
        padding: 20px;
      }

      .chart-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .segmented {
        display: inline-flex;
        padding: 3px;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        gap: 2px;
      }

      .segmented button {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
        white-space: nowrap;

        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .segmented button.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow-sm);
      }

      .chart-canvas-wrap {
        position: relative;
        width: 100%;
        height: 270px;
      }

      .chart-canvas-wrap canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .chart-tooltip {
        position: fixed;
        pointer-events: none;
        background: var(--text);
        color: var(--surface);
        padding: 8px 11px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.4;
        z-index: 80;
        opacity: 0;
        transition: opacity 0.1s ease;
        box-shadow: var(--shadow-lg);
        white-space: nowrap;
      }

      .chart-legend {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 14px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .legend-swatch {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex-shrink: 0;
      }

      /* Dashboard Bottom Grid */
      .two-col-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      }

      .three-col-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      /* Form Controls */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }

      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .input, .select, .textarea {
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        transition: border-color 0.15s ease;
      }

      .select-sm {
        height: 32px;
        padding: 0 10px;
        font-size: 12px;
      }

      .textarea {
        height: auto;
        min-height: 76px;
        padding: 10px 12px;
        resize: vertical;
      }

      .input:focus, .select:focus, .textarea:focus {
        border-color: var(--accent);
        outline: none;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      /* Tables */
      .table-wrap {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      thead th {
        padding: 11px 16px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        background: var(--surface-muted);
        white-space: nowrap;
      }

      tbody td {
        padding: 11px 16px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
        font-size: 13px;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody tr:hover {
        background: var(--surface-hover);
      }

      .text-right {
        text-align: right;
      }

      .student-link {
        background: transparent;
        border: none;
        padding: 0;
        color: var(--text);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        text-decoration: underline;
        text-decoration-color: transparent;
        text-underline-offset: 3px;
        transition: color 0.15s ease, text-decoration-color 0.15s ease;
      }

      .student-link:hover {
        color: var(--accent-text);
        text-decoration-color: var(--accent-text);
      }

      /* Semantic State Labels (Not decorative pills — explicit text + border) */
      .status-text {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 5px;
        white-space: nowrap;
      }

      .status-present {
        color: var(--success);
        background: var(--success-bg);
        border: 1px solid var(--success-border);
      }

      .status-late {
        color: var(--warning);
        background: var(--warning-bg);
        border: 1px solid var(--warning-border);
      }

      .status-absent {
        color: var(--danger);
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
      }

      .status-neutral {
        color: var(--text-secondary);
        background: var(--surface-muted);
        border: 1px solid var(--border);
      }

      /* Attendance Marking Toggle Group */
      .mark-group {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: var(--surface-muted);
      }

      .mark-btn {
        border: none;
        border-right: 1px solid var(--border);
        background: transparent;
        color: var(--text-secondary);
        padding: 7px 14px;
        min-height: 36px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.12s ease, color 0.12s ease;
      }

      .mark-btn:last-child {
        border-right: none;
      }

      .mark-btn:hover {
        background: var(--surface);
      }

      .mark-btn.active-present {
        background: var(--success);
        color: #ffffff;
      }

      .mark-btn.active-late {
        background: var(--warning);
        color: #ffffff;
      }

      .mark-btn.active-absent {
        background: var(--danger);
        color: #ffffff;
      }

      /* Progress Bar */
      .progress-track {
        width: 100%;
        height: 7px;
        border-radius: 4px;
        background: var(--surface-muted);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        border-radius: 4px;
      }

      /* Monthly Matrix / Calendar */
      .matrix-cell {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        text-align: center;
        padding: 4px 6px !important;
        min-width: 28px;
      }

      .cell-p { color: var(--success); background: var(--success-bg); }
      .cell-l { color: var(--warning); background: var(--warning-bg); }
      .cell-a { color: var(--danger); background: var(--danger-bg); }
      .cell-none { color: var(--text-muted); }

      /* Student Profile View */
      .profile-banner {
        padding: 22px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .profile-identity {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .avatar-initials {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: var(--accent-soft);
        color: var(--accent-text);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .meta-line {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      /* Empty State */
      .empty-state {
        padding: 44px 20px;
        text-align: center;
        color: var(--text-muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .empty-state h3 {
        font-size: 15px;
        color: var(--text);
        }

      .empty-state p {
        margin: 0;
        max-width: 400px;
        font-size: 13px;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 60;
      }

      .modal-overlay.open {
        display: flex;
      }

      .modal {
        width: 100%;
        max-width: 520px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }

      .modal-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modal-title {
        font-size: 16px;
        font-weight: 700;
      }

      .modal-body {
        padding: 20px;
        max-height: 75vh;
        overflow-y: auto;
      }

      .modal-footer {
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        background: var(--surface-muted);
      }

      /* Toast */
      .toast-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 90;
      }

      .toast {
        background: var(--text);
        color: var(--surface);
        padding: 11px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        display: flex;
        align-items: center;
        gap: 10px;
        animation: toastIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes toastIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }

      @media (max-width: 1120px) {
        .kpi-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .charts-grid {
          grid-template-columns: 1fr;
        }
        .two-col-grid {
          grid-template-columns: 1fr;
        }
        .three-col-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 960px) {
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          transform: translateX(-100%);
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .sidebar-backdrop.open {
          display: block;
        }
        .sidebar-close-btn,
        .mobile-menu-btn {
          display: inline-flex;
        }
        .global-search-wrap {
          width: 180px;
        }
      }

      @media (max-width: 640px) {
        .main-content {
          padding: 16px;
        }
        .topbar {
          padding: 0 14px;
        }
        .kpi-grid {
          grid-template-columns: 1fr;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .global-search-wrap {
          display: none;
        }
        .btn-hide-sm {
          display: none;
        }
      }

        function escapeHtml(str) {

          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function todayISO() {
          const d = new Date();
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          return yyyy + '-' + mm + '-' + dd;
        }

        function currentMonthISO() {
          return todayISO().slice(0, 7);

          if (!iso) return '—';
          const parts = iso.split('-');
          if (parts.length !== 3) return iso;
          const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            stu_11: 0.87,
            stu_12: 0.61
          };

          dates.forEach(function (dateStr, dIdx) {
            classes.forEach(function (cls) {
              const clsSubjects = subjects.filter(function (s) { return s.classId === cls.id; });
              const clsStudents = students.filter(function (st) { return st.classId === cls.id; });
              clsSubjects.forEach(function (sub, sIdx) {
                // Alternate or include both subjects on recent days
                if ((dIdx + sIdx) % 2 === 0 || dIdx >= dates.length - 4) {
                  clsStudents.forEach(function (stu, stIdx) {
                    const score = ((dIdx * 17 + sIdx * 11 + stIdx * 7) % 100) / 100;
                    const pThreshold = reliability[stu.id] || 0.85;
                    let status = 'present';
                    if (score > pThreshold) {
                      status = (score - pThreshold < 0.08) ? 'late' : 'absent';
                    }
                    attendance.push({
                      id: 'att_' + dateStr + '_' + sub.id + '_' + stu.id,
                      date: dateStr,
                      classId: cls.id,
                      subjectId: sub.id,
                      studentId: stu.id,
                      status: status
                    });
                  });
                }
              });
            });
          });

          return {
            classes: classes,
            subjects: subjects,
            students: students,
            attendance: attendance,
            settings: {
              institutionName: 'St. Xavier Institute of Technology',
              academicTerm: 'Fall Term 2026',
              threshold: 75,
              lateWeight: 1, // 1 = full credit (Present + Late), 0.5 = half credit, 0 = not counted
              theme: 'light'
            }
          };
        }

        /* ---------------- Calculations ---------------- */
        function computeStats(records) {
          let present = 0;
          let late = 0;
          let absent = 0;
          for (let i = 0; i < records.length; i++) {
            const st = records[i].status;
            if (st === 'present') present++;
            else if (st === 'late') late++;
            else if (st === 'absent') absent++;
          }
          const total = present + late + absent;
          const weight = Number(state.settings.lateWeight);
          const attendedUnits = present + late * (isNaN(weight) ? 1 : weight);
          const pct = total > 0 ? Math.round((attendedUnits / total) * 1000) / 10 : 0;
          return { present: present, late: late, absent: absent, total: total, pct: pct };
        }

        function getStudentStats(studentId, subjectIdFilter, monthFilter) {
          const recs = state.attendance.filter(function (r) {
            if (r.studentId !== studentId) return false;
            if (subjectIdFilter && subjectIdFilter !== 'all' && r.subjectId !== subjectIdFilter) return false;
            if (monthFilter && !r.date.startsWith(monthFilter)) return false;
            return true;
          });
          return computeStats(recs);
        }

        function classesNeededForThreshold(present, late, total, threshold) {
          if (total === 0) return 0;
          const weight = Number(state.settings.lateWeight);
          const attended = present + late * (isNaN(weight) ? 1 : weight);
          const currentPct = (attended / total) * 100;
          if (currentPct >= threshold) return 0;
          const t = threshold / 100;
          if (t >= 1) return Infinity;
          // (attended + x) / (total + x) >= t  =>  x >= (t * total - attended) / (1 - t)
          const needed = Math.ceil((t * total - attended) / (1 - t));
          return Math.max(1, needed);
        }

        function getClassById(id) {
          return state.classes.find(function (c) { return c.id === id; }) || null;
        }

        function getSubjectById(id) {
          return state.subjects.find(function (s) { return s.id === id; }) || null;
        }

        function getStudentById(id) {
          return state.students.find(function (s) { return s.id === id; }) || null;
        }

        function getLowAttendanceStudents() {
          const thr = Number(state.settings.threshold) || 75;
          return state.students
            .map(function (stu) {

            })
            .filter(function (item) {

            })

        /* ---------------- CSV Export ---------------- */
        function downloadCSV(filename, headers, rows) {
          function csvCell(val) {
            const s = String(val === null || val === undefined ? '' : val);
            if (/[",\n\r]/.test(s)) {
              return '"' + s.replace(/"/g, '""') + '"';
            }
            return s;
          }
          const lines = [headers.map(csvCell).join(',')];
          rows.forEach(function (r) {
            lines.push(r.map(csvCell).join(','));
          });
          const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          showToast('Exported ' + filename);
        }

        function getTrendSeries(granularity) {
          const byBucket = {};
          state.attendance.forEach(function (r) {
            let key = '';
            let label = '';
            if (granularity === 'monthly') {
              key = r.date.slice(0, 7);
              const parts = key.split('-');
              const d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
              label = d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
            } else {
              // Group by ISO week start (Monday)
              const parts = r.date.split('-');
              const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
              const day = d.getDay();
              const diff = (day === 0 ? -6 : 1) - day;
              d.setDate(d.getDate() + diff);
              const yyyy = d.getFullYear();
              const mm = String(d.getMonth() + 1).padStart(2, '0');
              const dd = String(d.getDate()).padStart(2, '0');
              key = yyyy + '-' + mm + '-' + dd;
              label = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
            if (!byBucket[key]) byBucket[key] = { key: key, label: label, records: [] };
            byBucket[key].records.push(r);
          });

          const keys = Object.keys(byBucket).sort();
          return keys.slice(-10).map(function (k) {
            const st = computeStats(byBucket[k].records);
            return {
              key: k,
              label: byBucket[k].label,
              pct: st.pct,
              total: st.total,
              present: st.present,
              late: st.late,
              absent: st.absent
            };
          });
        }

        function getBreakdownRecords(classId, period) {
          let minDate = '';
          if (period === '7' || period === '30') {
            const d = new Date();
            d.setDate(d.getDate() - Number(period));
            minDate = d.toISOString().slice(0, 10);
          } else if (period === 'month') {
            minDate = currentMonthISO() + '-01';
          }
          return state.attendance.filter(function (r) {
            if (classId !== 'all' && r.classId !== classId) return false;
            if (minDate && r.date < minDate) return false;
            return true;
          });
        }

        function drawTrendChart() {
          const canvas = document.getElementById('trendChartCanvas');
          if (!canvas) return;
          const wrap = canvas.parentElement;
          const dpr = window.devicePixelRatio || 1;
          const w = wrap.clientWidth;
          const h = wrap.clientHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
          ctx.clearRect(0, 0, w, h);

          const style = getComputedStyle(document.documentElement);
          const gridColor = style.getPropertyValue('--chart-grid').trim();
          const textMuted = style.getPropertyValue('--text-muted').trim();
          const lineColor = style.getPropertyValue('--chart-line').trim();
          const areaColor = style.getPropertyValue('--chart-area').trim();
          const surfaceColor = style.getPropertyValue('--surface').trim();
          const dangerColor = style.getPropertyValue('--danger').trim();

          const series = getTrendSeries(ui.trendGranularity);
          if (series.length === 0) {
            ctx.fillStyle = textMuted;
            ctx.font = '13px DM Sans, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('No attendance records yet to plot trend.', w / 2, h / 2);
            canvas._points = [];
            return;
          }

          const padL = 44;
          const padR = 20;
          const padT = 18;
          const padB = 34;
          const plotW = w - padL - padR;
          const plotH = h - padT - padB;

          // Horizontal grid lines (0, 25, 50, 75, 100)
          ctx.font = '11px JetBrains Mono, monospace';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          [0, 25, 50, 75, 100].forEach(function (val) {
            const y = padT + plotH - (val / 100) * plotH;
            ctx.strokeStyle = gridColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padL, y);
            ctx.lineTo(w - padR, y);
            ctx.stroke();
            ctx.fillStyle = textMuted;
            ctx.fillText(val + '%', padL - 8, y);
          });

          // Threshold line
          const thr = Number(state.settings.threshold) || 75;
          const thrY = padT + plotH - (thr / 100) * plotH;
          ctx.save();
          ctx.setLineDash([4, 4]);
          ctx.strokeStyle = dangerColor;
          ctx.lineWidth = 1.25;
          ctx.beginPath();
          ctx.moveTo(padL, thrY);
          ctx.lineTo(w - padR, thrY);
          ctx.stroke();
          ctx.restore();

          const pts = series.map(function (item, idx) {
            const x = series.length === 1 ? padL + plotW / 2 : padL + (idx / (series.length - 1)) * plotW;
            const y = padT + plotH - (item.pct / 100) * plotH;
            return { x: x, y: y, data: item };
          });

          // Area fill
          if (pts.length > 1) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, padT + plotH);
            pts.forEach(function (p) { ctx.lineTo(p.x, p.y); });
            ctx.lineTo(pts[pts.length - 1].x, padT + plotH);
            ctx.closePath();
            ctx.fillStyle = areaColor;
            ctx.fill();
          }

          // Line path
          ctx.beginPath();
          pts.forEach(function (p, idx) {
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.strokeStyle = lineColor;
          ctx.lineWidth = 2.5;
          ctx.lineJoin = 'round';
          ctx.stroke();

          // X labels & Data dots
          ctx.font = '11px DM Sans, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          pts.forEach(function (p) {
            ctx.fillStyle = textMuted;
            ctx.fillText(p.data.label, p.x, padT + plotH + 10);

            ctx.beginPath();
            ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = surfaceColor;
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = lineColor;
            ctx.stroke();
          });

          canvas._points = pts;
        }

        function drawBreakdownChart() {
          const canvas = document.getElementById('breakdownChartCanvas');
          if (!canvas) return;
          const wrap = canvas.parentElement;
          const dpr = window.devicePixelRatio || 1;
          const w = wrap.clientWidth;
          const h = wrap.clientHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
          ctx.clearRect(0, 0, w, h);

          const style = getComputedStyle(document.documentElement);
          const textColor = style.getPropertyValue('--text').trim();
          const textMuted = style.getPropertyValue('--text-muted').trim();
          const presentColor = style.getPropertyValue('--chart-present').trim();
          const lateColor = style.getPropertyValue('--chart-late').trim();
          const absentColor = style.getPropertyValue('--chart-absent').trim();
          const gridColor = style.getPropertyValue('--chart-grid').trim();

          const recs = getBreakdownRecords(ui.breakdownClassId, ui.breakdownPeriod);
          const st = computeStats(recs);

          if (st.total === 0) {
            ctx.fillStyle = textMuted;
            ctx.font = '13px DM Sans, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('No marks recorded for this selection.', w / 2, h / 2);
            canvas._slices = [];
            return;
          }

          const segments = [
            { label: 'Present', count: st.present, color: presentColor },
            { label: 'Late', count: st.late, color: lateColor },
            { label: 'Absent', count: st.absent, color: absentColor }
          ].filter(function (seg) { return seg.count > 0; });

          '<span class="tabular" style="color:var(--success);">Present: ' + st.present + '</span>' +
              '<span class="tabular" style="color:var(--warning);">Late: ' + st.late + '</span>' +
              '<span class="tabular" style="color:var(--danger);">Absent: ' + st.absent + '</span>' +

            (recs.length > 150 ? '<div style="padding:12px 16px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border);">Showing first 150 of ' + recs.length + ' records. Export CSV for complete log.</div>' : '') +

                '<div style="display:flex;gap:10px;flex-wrap:wrap;padding-top:6px;">' +
                  '<button type="button" class="btn btn-primary" onclick="downloadSourceHtml()">Download index.html</button>' +
                  '<button type="button" class="btn btn-secondary" onclick="openSourceCopyModal()">View / Copy Full HTML</button>' +
                  '<button type="button" class="btn btn-secondary" onclick="exportOverallCSV()">Export Full CSV</button>' +
            '<button type="button" class="btn btn-secondary" onclick="confirmResetDemo()">Restore Demo Data</button>' +
                  '<button type="button" class="btn btn-danger" onclick="confirmClearAll()">Clear All Data</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }

        function getStandaloneHtml() {
          const clone = document.documentElement.cloneNode(true);
          clone.removeAttribute('data-theme');
          const viteScripts = clone.querySelectorAll('script[src*="@vite"]');
          viteScripts.forEach(function (el) { el.remove(); });
          const mainEl = clone.querySelector('#mainContent');
          if (mainEl) mainEl.innerHTML = '';
          const toastEl = clone.querySelector('#toastContainer');
          if (toastEl) toastEl.innerHTML = '';
          const tipEl = clone.querySelector('#chartTooltip');
          if (tipEl) { tipEl.innerHTML = ''; tipEl.removeAttribute('style'); }
          const ddEl = clone.querySelector('#globalSearchDropdown');
          if (ddEl) { ddEl.innerHTML = ''; ddEl.classList.remove('open'); }
          const modalEl = clone.querySelector('#modalOverlay');
          if (modalEl) modalEl.classList.remove('open');
          const mBody = clone.querySelector('#modalBody');
          if (mBody) mBody.innerHTML = '';
          const mFoot = clone.querySelector('#modalFooter');
          if (mFoot) mFoot.innerHTML = '';
          const instEl = clone.querySelector('#sidebarInstitution');
          if (instEl) instEl.textContent = '';
          const alertEl = clone.querySelector('#sidebarAlertCount');
          if (alertEl) alertEl.textContent = '0';
          return '<!doctype html>\n' + clone.outerHTML;
        }

        window.downloadSourceHtml = function () {
          const htmlText = getStandaloneHtml();
          const blob = new Blob([htmlText], { type: 'text/html;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'index.html';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          showToast('Downloaded standalone index.html');
        };

        window.openSourceCopyModal = function () {
          const htmlText = getStandaloneHtml();
          openModal(
            'Complete Standalone index.html',
            '<div class="field"><label class="field-label" for="sourceCodeBox">Full Single-File Code (' + htmlText.split('\n').length + ' lines)</label>' +
              '<textarea id="sourceCodeBox" class="textarea mono" readonly style="min-height:280px;font-size:11px;line-height:1.45;"></textarea></div>',
            '<button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>' +
            '<button type="button" class="btn btn-secondary" onclick="downloadSourceHtml()">Download File</button>' +
            '<button type="button" class="btn btn-primary" onclick="copySourceCodeBox()">Copy All</button>'
          );
          const box = document.getElementById('sourceCodeBox');
          if (box) box.value = htmlText;
        };

        window.copySourceCodeBox = function () {
          const box = document.getElementById('sourceCodeBox');
          if (!box) return;
          box.focus();
          box.select();
          box.setSelectionRange(0, box.value.length);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(box.value).then(function () {
              showToast('Copied complete index.html to clipboard');
            }).catch(function () {
              document.execCommand('copy');
              showToast('Copied complete index.html');
            });
          } else {
            document.execCommand('copy');
            showToast('Copied complete index.html');
          }
        };

        window.saveSettingsForm = function () {
          const inst = document.getElementById('setInstName').value.trim() || 'College Attendance Portal';
          const term = document.getElementById('setTerm').value.trim() || 'Academic Term';
          const thr = Math.min(95, Math.max(50, Number(document.getElementById('setThreshold').value) || 75));
          const lw = Number(document.getElementById('setLateWeight').value);
          state.settings.institutionName = inst;
          state.settings.academicTerm = term;
          state.settings.threshold = thr;
          state.settings.lateWeight = isNaN(lw) ? 1 : lw;
          saveState();
          render();
          showToast('Settings saved to localStorage');
        };

        window.confirmResetDemo = function () {
          openModal(
            'Restore Demo Data',
            '<p style="margin:0;color:var(--text-secondary);">Replace current localStorage records with the default sample college dataset (3 classes, 6 subjects, 12 students, 22 days of attendance)?</p>',
            '<button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
            '<button type="button" class="btn btn-primary" onclick="executeResetDemo()">Restore Demo Data</button>'
          );
        };

        window.executeResetDemo = function () {
          const theme = state.settings.theme;
          state = buildSeedData();
          state.settings.theme = theme;
          saveState();
          syncUiDefaults();
          loadDraftForCurrentSession();
          closeModal();
          render();
          showToast('Sample dataset restored');
        };

        window.confirmClearAll = function () {
          openModal(
            'Clear All Data',
            '<p style="margin:0;color:var(--text-secondary);">Permanently delete all students, classes, subjects, and attendance history from localStorage? This cannot be undone.</p>',
            '<button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
            '<button type="button" class="btn btn-danger" onclick="executeClearAll()">Clear Everything</button>'
          );
        };

        window.executeClearAll = function () {
          state = {
            classes: [],
            subjects: [],
            students: [],
            attendance: [],
            settings: state.settings
          };
          ui.markClassId = '';
          ui.markSubjectId = '';
          ui.markDraft = {};
          ui.reportClassId = '';
          ui.selectedStudentId = null;
          saveState();
          closeModal();
          render();
          showToast('All localStorage data cleared');
        };

        /* ---------------- Master Render ---------------- */
        function updateChrome() {
          // Sidebar active state
          const navItems = document.querySelectorAll('.nav-item[data-view]');
          navItems.forEach(function (btn) {
            btn.classList.toggle('active', btn.getAttribute('data-view') === ui.view);
          });

          // Sidebar alert badge
          const alertCount = getLowAttendanceStudents().length;
          const badge = document.getElementById('sidebarAlertCount');
          if (badge) {
            badge.textContent = alertCount > 0 ? String(alertCount) : '0';
            badge.style.color = alertCount > 0 ? 'var(--danger)' : 'var(--text-muted)';
          }

          // Sidebar institution footer
          const instEl = document.getElementById('sidebarInstitution');
          if (instEl) {
            instEl.textContent = state.settings.institutionName + ' · ' + state.settings.academicTerm;
          }

          // Topbar Breadcrumb
          const titles = {
            dashboard: 'Dashboard',
            mark: 'Mark Attendance',
            students: 'Students',
            academics: 'Classes & Subjects',
            datewise: 'Date-wise Log',
            monthly: 'Monthly Reports',
            alerts: 'Low Attendance Alerts',
            'student-profile': 'Student Profile',
            settings: 'Settings & Storage'
          };
          const bc = document.getElementById('topbarBreadcrumb');
          if (bc) {
            if (ui.view === 'student-profile' && ui.selectedStudentId) {
              const stu = getStudentById(ui.selectedStudentId);
              bc.innerHTML = '<span>AttendEase</span><span>/</span><span>Students</span><span>/</span><strong>' + escapeHtml(stu ? stu.name : 'Profile') + '</strong>';
            } else {
              bc.innerHTML = '<span>AttendEase</span><span>/</span><strong>' + escapeHtml(titles[ui.view] || 'Dashboard') + '</strong>';
            }
          }
        }

        function render() {
          syncUiDefaults();
          updateChrome();
          const main = document.getElementById('mainContent');
          if (ui.view === 'dashboard') {
            main.innerHTML = renderDashboardView();
            requestAnimationFrame(renderDashboardCharts);
          } else if (ui.view === 'mark') {
            main.innerHTML = renderMarkAttendanceView();
          } else if (ui.view === 'students') {
            main.innerHTML = renderStudentsView();
          } else if (ui.view === 'academics') {
            main.innerHTML = renderAcademicsView();
          } else if (ui.view === 'datewise') {
            main.innerHTML = renderDatewiseView();
          } else if (ui.view === 'monthly') {
            main.innerHTML = renderMonthlyView();
          } else if (ui.view === 'alerts') {
            main.innerHTML = renderAlertsView();
          } else if (ui.view === 'student-profile') {
            main.innerHTML = renderStudentProfileView();
          } else if (ui.view === 'settings') {
            main.innerHTML = renderSettingsView();
          }
        }

        /* ---------------- Boot ---------------- */
        applyTheme();
        syncUiDefaults();
        loadDraftForCurrentSession();
        render();
      })();
    </script>
  </body>
</html>
